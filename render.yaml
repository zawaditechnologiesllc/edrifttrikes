# Render blueprint — E-Drift Trikes backend service.
# Deploy: New + → Blueprint → connect this repo. Render reads this file.
services:
  - type: web
    name: edrift-backend
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        sync: false # https://edrifttrikes.shop
      - key: INTERNAL_API_KEY
        generateValue: true # share this same value with the Cloudflare app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDERS_NOTIFICATION_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # PayPal — same credentials as the Cloudflare app, used here to verify
      # inbound webhook signatures. PAYPAL_WEBHOOK_ID comes from the webhook you
      # create in the PayPal Developer dashboard (see docs/DEPLOYMENT.md §4b).
      - key: PAYPAL_ENV
        sync: false # sandbox | live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
