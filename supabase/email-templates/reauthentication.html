<!--
  Supabase Auth → Authentication → Emails → "Reauthentication"
  Subject:  Your E-Drift verification code
  This one uses a 6-digit code ({{ .Token }}), NOT a link. Sent when a sensitive
  action needs the user to re-verify.
-->
<!doctype html>
<html>
  <body style="margin:0;background:#0e0e11;font-family:Inter,Arial,sans-serif;color:#e4e1e6">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <div style="font-family:Anton,'Arial Black',Arial,sans-serif;font-size:28px;letter-spacing:1px;color:#c4f731">E-DRIFT</div>
      <div style="height:3px;width:48px;background:#c4f731;margin:12px 0 28px"></div>

      <h1 style="font-family:Anton,'Arial Black',Arial,sans-serif;font-weight:400;font-size:26px;color:#ffffff;text-transform:uppercase;margin:0 0 16px">
        Verification code
      </h1>
      <p style="color:#c3c5d9;line-height:1.6;margin:0 0 8px">
        Enter this code to confirm it's you:
      </p>

      <div style="margin:24px 0;font-family:Anton,'Arial Black',Arial,sans-serif;font-size:40px;letter-spacing:8px;color:#c4f731;background:#17171c;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:20px;text-align:center">
        {{ .Token }}
      </div>

      <p style="color:#8d90a2;line-height:1.6;font-size:13px;margin:16px 0 0">
        This code expires shortly. Didn't request it? You can ignore this email.
      </p>

      <div style="margin-top:40px;border-top:1px solid rgba(255,255,255,0.1);padding-top:16px;color:#8d90a2;font-size:12px;letter-spacing:1px;text-transform:uppercase">
        E-Drift Motors · Engineered for adrenaline
      </div>
    </div>
  </body>
</html>
