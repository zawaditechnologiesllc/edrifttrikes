<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>E-DRIFT | ACCESS THE GARAGE</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-fixed": "#dce1ff",
                    "outline-variant": "#434656",
                    "on-tertiary-fixed": "#3a0b00",
                    "surface-container-highest": "#353438",
                    "on-primary": "#002681",
                    "on-background": "#e4e1e6",
                    "error": "#ffb4ab",
                    "tertiary-fixed-dim": "#ffb59e",
                    "secondary-container": "#a9da00",
                    "error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#852400",
                    "tertiary": "#ffb59e",
                    "surface-container-low": "#1b1b1e",
                    "tertiary-fixed": "#ffdbd0",
                    "secondary": "#c4f731",
                    "on-surface": "#e4e1e6",
                    "on-secondary-fixed-variant": "#3a4d00",
                    "primary-container": "#1e5bff",
                    "on-tertiary-container": "#ffeae4",
                    "primary-fixed-dim": "#b7c4ff",
                    "on-primary-fixed-variant": "#0039b5",
                    "secondary-fixed-dim": "#a6d700",
                    "inverse-surface": "#e4e1e6",
                    "surface-tint": "#b7c4ff",
                    "surface-dim": "#131316",
                    "surface-bright": "#39393c",
                    "on-secondary-fixed": "#151f00",
                    "on-error-container": "#ffdad6",
                    "tertiary-container": "#c53a00",
                    "on-surface-variant": "#c3c5d9",
                    "on-secondary-container": "#455c00",
                    "secondary-fixed": "#c1f42e",
                    "on-tertiary": "#5e1700",
                    "inverse-on-surface": "#303033",
                    "background": "#131316",
                    "surface-variant": "#353438",
                    "on-primary-container": "#ecedff",
                    "surface-container": "#1f1f22",
                    "surface-container-lowest": "#0e0e11",
                    "on-secondary": "#273500",
                    "outline": "#8d90a2",
                    "surface": "#131316",
                    "on-primary-fixed": "#001551",
                    "on-error": "#690005",
                    "primary": "#b7c4ff",
                    "inverse-primary": "#004cec",
                    "surface-container-high": "#2a2a2d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "16px",
                    "gutter": "24px",
                    "max-width": "1440px",
                    "unit": "4px",
                    "margin-desktop": "64px"
            },
            "fontFamily": {
                    "headline-md": ["Anton"],
                    "label-bold": ["Inter"],
                    "headline-xl": ["Anton"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Anton"],
                    "display-lg-mobile": ["Anton"]
            },
            "fontSize": {
                    "headline-md": ["32px", {"lineHeight": "1.2", "fontWeight": "400"}],
                    "label-bold": ["14px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-xl": ["48px", {"lineHeight": "1.1", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "display-lg": ["84px", {"lineHeight": "1.0", "letterSpacing": "0.02em", "fontWeight": "400"}],
                    "display-lg-mobile": ["48px", {"lineHeight": "1.1", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }
        
        .garage-grid {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .auth-card-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slant-divider {
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #1e5bff;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md overflow-x-hidden">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- LEFT SIDE: High-Energy Action Canvas -->
<section class="relative w-full md:w-1/2 lg:w-3/5 h-[40vh] md:h-screen overflow-hidden group">
<div class="absolute inset-0 bg-black/40 z-10"></div>
<img class="absolute inset-0 w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-1000" src="/assets/garage-workshop-night.jpg"/>
<!-- Branding Overlay -->
<div class="absolute bottom-12 left-margin-desktop z-20">
<h1 class="font-display-lg text-display-lg text-white tracking-tighter leading-none mb-4">
                    E-DRIFT<br/>MOTORS
                </h1>
<div class="flex items-center gap-4">
<span class="w-12 h-[2px] bg-secondary"></span>
<p class="font-label-bold text-label-bold text-white uppercase tracking-widest">Precision Performance</p>
</div>
</div>
<!-- Kinetic Technical Overlay -->
<div class="absolute inset-0 z-15 pointer-events-none opacity-30 garage-grid"></div>
</section>
<!-- RIGHT SIDE: Authentication Canvas -->
<section class="w-full md:w-1/2 lg:w-2/5 min-h-screen bg-surface flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop relative garage-grid">
<!-- Technical Border Accents -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-container to-transparent opacity-50"></div>
<div class="w-full max-w-md auth-card-transition">
<!-- Header -->
<header class="mb-12">
<h2 class="font-headline-xl text-headline-xl text-on-surface tracking-tight mb-2">ACCESS THE GARAGE</h2>
<p class="text-on-surface-variant font-body-md">Sign in to manage your fleet and performance specs.</p>
</header>
<!-- Auth Tabs -->
<div class="flex mb-10 border-b border-outline-variant/30">
<button class="flex-1 py-4 font-label-bold text-label-bold tracking-widest text-secondary border-b-2 border-secondary transition-all" id="tab-login" onclick="switchTab('login')">LOGIN</button>
<button class="flex-1 py-4 font-label-bold text-label-bold tracking-widest text-on-surface-variant hover:text-on-surface transition-all" id="tab-register" onclick="switchTab('register')">REGISTER</button>
</div>
<!-- Social Authentication -->
<div class="grid grid-cols-2 gap-gutter mb-8">
<button class="flex items-center justify-center gap-3 bg-surface-container-high py-3 px-6 rounded hover:bg-surface-variant transition-colors border border-white/5 active:scale-95 duration-75">
<img alt="Google" class="w-5 h-5" src="/assets/mechanic-sleeve-install.jpg"/>
<span class="font-label-bold text-xs">GOOGLE</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-high py-3 px-6 rounded hover:bg-surface-variant transition-colors border border-white/5 active:scale-95 duration-75">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">apps</span>
<span class="font-label-bold text-xs">APPLE</span>
</button>
</div>
<div class="relative flex items-center justify-center mb-8">
<div class="w-full border-t border-outline-variant/20"></div>
<span class="absolute px-4 bg-surface text-on-surface-variant text-[10px] font-label-bold tracking-widest">OR USE EMAIL</span>
</div>
<!-- Login Form -->
<form class="space-y-6" id="auth-form">
<div class="space-y-1 group">
<label class="block font-label-bold text-[11px] text-on-surface-variant tracking-wider uppercase group-focus-within:text-primary-container transition-colors">Commander Email</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg p-4 text-on-surface font-body-md placeholder:text-outline-variant transition-all focus:border-primary-container focus:ring-0" placeholder="PILOT@EDRIFT.COM" required="" type="email"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-lg">alternate_email</span>
</div>
</div>
<div class="space-y-1 group">
<div class="flex justify-between items-end">
<label class="block font-label-bold text-[11px] text-on-surface-variant tracking-wider uppercase group-focus-within:text-primary-container transition-colors">Access Key</label>
<a class="text-[10px] font-label-bold text-primary hover:underline uppercase tracking-tighter" href="#">Lost Key?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border border-outline-variant/30 rounded-lg p-4 text-on-surface font-body-md placeholder:text-outline-variant transition-all focus:border-primary-container focus:ring-0" placeholder="••••••••••••" required="" type="password"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-lg">lock_open</span>
</div>
</div>
<div class="flex items-center gap-3">
<input class="w-4 h-4 rounded border-outline-variant bg-surface-container-low text-primary-container focus:ring-primary-container" id="remember" type="checkbox"/>
<label class="text-xs font-label-bold text-on-surface-variant uppercase tracking-wider" for="remember">Maintain session</label>
</div>
<button class="w-full bg-primary-container text-white py-5 rounded-lg font-label-bold text-label-bold tracking-[0.2em] shadow-xl shadow-primary-container/20 hover:bg-inverse-primary hover:-translate-y-0.5 transition-all active:scale-95" type="submit">
                        INITIALIZE LOGIN
                    </button>
</form>
<!-- Guest Checkout / Footer Actions -->
<div class="mt-12 text-center space-y-6">
<button class="font-label-bold text-xs text-on-surface-variant hover:text-secondary tracking-widest uppercase flex items-center justify-center gap-2 mx-auto transition-colors">
                        CONTINUE AS GUEST
                        <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<p class="text-[10px] text-outline uppercase tracking-widest font-label-bold opacity-50">
                        © 2024 E-DRIFT MOTORS. ENGINEERED FOR ADRENALINE.
                    </p>
</div>
</div>
</section>
</main>
<script>
        function switchTab(mode) {
            const loginBtn = document.getElementById('tab-login');
            const registerBtn = document.getElementById('tab-register');
            const submitBtn = document.querySelector('#auth-form button[type="submit"]');
            const headerH2 = document.querySelector('header h2');
            const headerP = document.querySelector('header p');

            if (mode === 'register') {
                loginBtn.classList.remove('text-secondary', 'border-secondary');
                loginBtn.classList.add('text-on-surface-variant');
                registerBtn.classList.add('text-secondary', 'border-secondary');
                registerBtn.classList.remove('text-on-surface-variant');
                
                submitBtn.innerText = 'CREATE PROFILE';
                headerH2.innerText = 'JOIN THE SQUADRON';
                headerP.innerText = 'Establish your identity in the electric drift era.';
            } else {
                registerBtn.classList.remove('text-secondary', 'border-secondary');
                registerBtn.classList.add('text-on-surface-variant');
                loginBtn.classList.add('text-secondary', 'border-secondary');
                loginBtn.classList.remove('text-on-surface-variant');
                
                submitBtn.innerText = 'INITIALIZE LOGIN';
                headerH2.innerText = 'ACCESS THE GARAGE';
                headerP.innerText = 'Sign in to manage your fleet and performance specs.';
            }
        }

        // Lightweight atmospheric effect: Grid mouse interaction
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 20 - 10;
            const y = (e.clientY / window.innerHeight) * 20 - 10;
            const card = document.querySelector('.auth-card-transition');
            if (card) {
                card.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            }
        });
    </script>
</body></html>
