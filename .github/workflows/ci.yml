# Build check — runs the unit tests and a typecheck, then proves every pushed
# commit can build exactly the way Cloudflare Workers Builds does (npm
# clean-install, then the OpenNext build).
# If this is green and a Cloudflare deploy still fails, the problem is in the
# Cloudflare project settings (build command / branch / variables), not the code.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unit tests first: a money-math or delivery-schedule regression should
      # fail here in seconds, not after a full OpenNext build.
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run cf:build
      # The server bundle and the asset bundle are shipped together and have to
      # agree. Next names static files by content hash, so changing one Tailwind
      # class renames the stylesheet — and a deploy that updates the server
      # without the assets serves 200 OK pages referencing a 404 stylesheet.
      # The site renders as raw HTML and no status-code health check notices.
      - name: Every referenced static file is in the asset bundle
        run: node scripts/check-assets.mjs
      - name: Validate wrangler config (dry run)
        run: npx wrangler deploy --dry-run
